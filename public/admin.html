<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Admin Quick Count Pilkades Wonogiri 2026</title>
<style>
:root{color-scheme:light;--bg:#f5f4ef;--card:#fff;--ink:#1d1b17;--mut:#645f57;--line:rgba(29,27,23,.14);--acc:#1456c8;--fin:#16794a;--r-sm:8px;--r-lg:12px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s7:48px}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:0 clamp(16px,5vw,48px)}
.band{background:var(--acc);color:#fff;padding:var(--s5) 0}
h1{margin:0;font-size:clamp(22px,3vw,28px);line-height:1.2;letter-spacing:-.02em;font-weight:600}
main{padding:var(--s5) 0 var(--s7)}
:focus-visible{outline:3px solid #e8a33d;outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--s5);margin-bottom:var(--s4)}
label{display:grid;gap:4px;font-size:13px;font-weight:500;color:var(--mut)}
select,input[type=text],input[type=password],input[type=number]{min-height:44px;border:1px solid var(--line);border-radius:var(--r-sm);font:inherit;color:var(--ink);background:var(--card);padding:0 var(--s4);width:100%}
.btn{min-height:44px;padding:0 var(--s5);border:1px solid var(--ink);border-radius:var(--r-sm);background:var(--ink);color:#fff;font:inherit;font-weight:500;cursor:pointer;transition:transform .1s,opacity .15s}
.btn:hover{opacity:.88}.btn:active{transform:translateY(1px)}.btn:disabled{opacity:.5;cursor:wait}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4)}
.cal{display:grid;grid-template-columns:72px 1fr;gap:var(--s4);align-items:start}
.ph{position:relative;width:72px;height:72px;border-radius:var(--r-sm);background:rgba(29,27,23,.08);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--mut);font-weight:600}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.nm{font-weight:600;margin:0 0 var(--s2)}
.f{display:flex;flex-wrap:wrap;gap:var(--s3);align-items:flex-end}
.f label:first-child{width:110px}
.st{min-height:1.6em;margin:var(--s2) 0 0;color:var(--mut)}
.st.ok{color:var(--fin)}
[hidden]{display:none!important}
@media (max-width:560px){.row2{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="band"><div class="wrap"><h1>Admin: foto dan nomor urut calon</h1></div></header>
<main><div class="wrap">
<div class="card" id="login">
<label>Kunci admin<input type="password" id="key" autocomplete="current-password"></label>
<p class="st" id="msg" role="status"></p>
<button class="btn" id="go" type="button">Masuk</button>
</div>
<div id="work" hidden>
<div class="card row2">
<label>Kecamatan<select id="fk"></select></label>
<label>Desa<select id="fd"></select></label>
</div>
<div id="list"></div>
</div>
</div></main>
<script>
const $=id=>document.getElementById(id);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
let KEY='',ITEMS=[];
const MAXB=40*1024;
const call=(fn,data)=>fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fn,key:KEY,data})}).then(r=>r.json());
const toBlob=(c,q)=>new Promise(r=>c.toBlob(r,'image/jpeg',q));
const toB64=bl=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=no;r.readAsDataURL(bl)});
// Potong persegi (condong ke atas agar wajah tidak terpotong), lalu turunkan ukuran/kualitas sampai <= 40 KB
async function compress(file){
 const b=await createImageBitmap(file),side=Math.min(b.width,b.height),
  sx=(b.width-side)/2,sy=b.height>b.width?(b.height-side)*.15:0;
 for(const px of [320,280,240,200,160,128]){
  const c=document.createElement('canvas');c.width=c.height=px;
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,px,px);x.drawImage(b,sx,sy,side,side,0,0,px,px);
  for(let q=.85;q>=.35;q-=.1){const bl=await toBlob(c,q);if(bl.size<=MAXB)return{blob:bl,b64:await toB64(bl)}}}
 throw new Error('size')}
$('go').onclick=()=>{KEY=$('key').value;$('msg').textContent='Memuat...';
 call('list').then(r=>{if(r.error){$('msg').textContent=r.error==='unauthorized'?'Kunci admin salah.':r.error;return}
  ITEMS=r.items;$('login').hidden=true;$('work').hidden=false;fillK()}).catch(()=>$('msg').textContent='Gagal terhubung.')};
$('key').onkeydown=e=>{if(e.key==='Enter')$('go').click()};
function fillK(){$('fk').replaceChildren(...[...new Set(ITEMS.map(i=>i.kecamatan))].map(k=>{const o=el('option',null,k);o.value=k;return o}));fillD()}
function fillD(){const k=$('fk').value;
 $('fd').replaceChildren(...[...new Set(ITEMS.filter(i=>i.kecamatan===k).map(i=>i.desa))].map(d=>{const o=el('option',null,d);o.value=d;return o}));rows()}
$('fk').onchange=fillD;$('fd').onchange=rows;
function rows(){
 const k=$('fk').value,d=$('fd').value;
 $('list').replaceChildren(...ITEMS.filter(i=>i.kecamatan===k&&i.desa===d).map(row))}
function row(it){
 const c=el('div','card cal'),ph=el('div','ph',it.nama.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase());
 const show=u=>{ph.querySelector('img')?.remove();const im=new Image();im.src=u;im.alt='Foto '+it.nama;im.onerror=()=>im.remove();ph.append(im)};
 if(it.foto)show(it.foto);
 const b=el('div'),n=el('p','nm',it.nama),f=el('div','f');
 const nl=el('label','','Nomor urut'),num=el('input');num.type='number';num.min='1';num.max='99';num.value=it.nomor_urut||'';nl.append(num);
 const fl=el('label','','Foto (JPG/PNG, otomatis dikecilkan)'),file=el('input');file.type='file';file.accept='image/*';fl.append(file);
 const btn=el('button','btn','Simpan');btn.type='button';const st=el('p','st');st.setAttribute('role','status');
 file.onchange=()=>{if(file.files[0])show(URL.createObjectURL(file.files[0]))};
 btn.onclick=async()=>{btn.disabled=true;st.className='st';st.textContent='Menyimpan...';
  const data={kecamatan:it.kecamatan,desa:it.desa,nama:it.nama,nomor_urut:num.value.trim()};
  let kb='';
  try{if(file.files[0]){const c=await compress(file.files[0]);data.foto_b64=c.b64;kb=' Foto dikompres menjadi '+Math.max(1,Math.round(c.blob.size/1024))+' KB.';show(URL.createObjectURL(c.blob))}
   const r=await call('save',data);
   if(r.error)st.textContent=r.error;else{st.textContent='Tersimpan.'+kb+' Dashboard menampilkan perubahan dalam sekitar 1 menit.';st.className='st ok';it.nomor_urut=data.nomor_urut;file.value=''}
  }catch(e){st.textContent=e.message==='size'?'Foto tidak bisa dikecilkan sampai 40 KB. Coba foto lain.':'Gagal memproses atau menyimpan foto. Gunakan JPG atau PNG.'}
  btn.disabled=false};
 f.append(nl,fl,btn);b.append(n,f,st);c.append(ph,b);return c}
</script>
</body>
</html>
