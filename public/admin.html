<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Admin Quick Count Pilkades Wonogiri 2026</title>
<style>
:root{color-scheme:light;--bg:#f1f4f5;--card:#fff;--ink:#1d1b17;--mut:#645f57;--line:rgba(29,27,23,.14);--acc:#b5121b;--fin:#16794a;--r-sm:8px;--r-lg:12px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s7:48px}
*{box-sizing:border-box}
html,body{margin:0}
@font-face{font-family:"Jakarta";src:url(/fonts/jakarta.woff2) format("woff2");font-weight:200 800;font-display:swap}
body{background:var(--bg);color:var(--ink);font:16px/1.6 "Jakarta",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:0 clamp(16px,5vw,48px)}
.band{background:var(--acc);color:#fff;padding:var(--s5) 0;border-bottom:4px solid #d4b34a}.band>.wrap{display:flex;align-items:center;justify-content:space-between;gap:var(--s4);flex-wrap:wrap}.hd{display:flex;align-items:center;gap:var(--s4)}.hd img{flex:none;height:auto}
h1{margin:0;font-size:clamp(22px,3vw,28px);line-height:1.2;letter-spacing:-.02em;font-weight:600}
main{padding:var(--s5) 0 var(--s7)}
:focus-visible{outline:3px solid #e8a33d;outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--s5);margin-bottom:var(--s4)}
label{display:grid;gap:4px;font-size:13px;font-weight:500;color:var(--mut)}
select,input[type=password],input[type=number]{min-height:44px;border:1px solid var(--line);border-radius:var(--r-sm);font:inherit;color:var(--ink);background:var(--card);padding:0 var(--s4);width:100%}
input[type=range]{width:240px;max-width:100%;min-height:44px}
.btn{min-height:44px;padding:0 var(--s5);border:1px solid var(--ink);border-radius:var(--r-sm);background:var(--ink);color:#fff;font:inherit;font-weight:500;cursor:pointer;transition:transform .1s,opacity .15s}
.btn:hover{opacity:.88}.btn:active{transform:translateY(1px)}.btn:disabled{opacity:.5;cursor:wait}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4)}
.cal{display:grid;grid-template-columns:72px 1fr;gap:var(--s4);align-items:start}
.ph{position:relative;width:72px;aspect-ratio:var(--ar,2/3);border-radius:var(--r-sm);background:rgba(29,27,23,.08);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--mut);font-weight:600}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.nm{font-weight:600;margin:0 0 var(--s2)}
.f{display:flex;flex-wrap:wrap;gap:var(--s3);align-items:flex-end}
.f .nu{width:110px}.f .rs{width:130px}
.ed{margin:var(--s3) 0}
.ed{display:grid;grid-template-columns:auto minmax(200px,1fr);gap:var(--s4);align-items:start;padding:var(--s4);border:1px solid var(--line);border-radius:var(--r-lg);background:#fafbfb}
.ed>.st{grid-column:1/-1;margin:0}
.stg{background:repeating-conic-gradient(#e7e9ec 0 25%,#fff 0 50%) 0 0/16px 16px;border-radius:var(--r-sm);padding:6px}
.ed canvas{display:block;width:260px;max-width:100%;height:auto;border-radius:4px;cursor:grab;touch-action:none;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.ed canvas:active{cursor:grabbing}
.edt{display:grid;gap:var(--s3)}
.rg{display:grid;grid-template-columns:70px 1fr 64px;align-items:center;gap:var(--s2);font-size:14px;color:var(--ink)}
.rg input{width:100%;accent-color:#b5121b;min-height:36px}
.rg output{font-variant-numeric:tabular-nums;text-align:right;color:var(--mut);font-size:13px}
.edb{display:flex;flex-wrap:wrap;gap:var(--s2)}
.btn.sm{min-height:40px;padding:0 var(--s3);font-size:14px}
.btn.alt[aria-pressed=true]{background:var(--ink);color:#fff}
.drop{position:relative;display:flex;align-items:center;gap:var(--s3);min-height:56px;padding:var(--s3) var(--s4);border:2px dashed rgba(29,27,23,.25);border-radius:var(--r-lg);background:#fff;color:var(--mut);font-size:14px;cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop:focus-within{border-color:#d4b34a;background:#fbf5e1}
.drop b{color:var(--ink)}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.card.dragging{outline:3px dashed #b5121b;outline-offset:-3px;background:#fbe9ea}
.card.dragging .drop{border-color:#b5121b;background:#fbe9ea}
.card.cal{position:relative}
@media (max-width:640px){.ed{grid-template-columns:1fr}.ed canvas{width:100%}}
.st{min-height:1.6em;margin:var(--s2) 0 0;color:var(--mut)}
.st.ok{color:var(--fin)}
[hidden]{display:none!important}
@media (max-width:560px){.row2{grid-template-columns:1fr}}

input[type=text]{min-height:44px;border:1px solid var(--line);border-radius:var(--r-sm);font:inherit;color:var(--ink);background:var(--card);padding:0 var(--s4);width:100%}
h2{margin:0 0 var(--s3);font-size:20px;line-height:1.3;font-weight:600}
.lnk{color:#fff;display:inline-block;margin-top:var(--s2)}
.tabs{display:flex;flex-wrap:wrap;gap:var(--s2);margin-bottom:var(--s4)}
.tabs button{min-height:44px;padding:0 var(--s4);border:1px solid var(--line);border-radius:99px;background:var(--card);font:inherit;font-weight:500;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.vr{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);padding:var(--s3) 0;border-top:1px solid var(--line)}
.vl{display:flex;align-items:center;gap:var(--s3);flex:1;flex-wrap:wrap;color:var(--ink);font-size:16px;font-weight:500}
.vl input{width:130px;font-size:18px}
.vn{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;border-radius:99px;background:var(--ink);color:#fff;font-size:13px;font-weight:600}
.pc{min-width:64px;text-align:right;color:var(--mut);font-variant-numeric:tabular-nums}
.ck{display:flex;align-items:center;gap:var(--s2);min-height:44px;font-size:16px;color:var(--ink)}
.ck input{width:20px;height:20px}
.f .nmf{width:220px}
.btns{display:flex;flex-wrap:wrap;gap:var(--s3);margin-top:var(--s4)}
.btn.alt{background:transparent;color:var(--ink)}
.hd>div:not(.hr){flex:1;min-width:200px}.hr{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap}
.sync{display:inline-flex;align-items:center;gap:var(--s2);font-size:14px;font-weight:600;background:rgba(255,255,255,.14);padding:6px 12px;border-radius:99px}
.sync i{width:10px;height:10px;border-radius:50%;background:#6ee7a1}
.sync.busy i{background:none;border:2px solid #fff;border-top-color:transparent;animation:spin .7s linear infinite}
.sync.bad i{background:#ffd166}
.btn.out{background:transparent;border-color:rgba(255,255,255,.7);color:#fff}
.fail{background:#fdecea;border-bottom:1px solid #f3b4ae;color:#8a1c12;padding:var(--s3) 0}
.fail .wrap{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);flex-wrap:wrap;font-weight:600}
.fail .btn{background:#b42318;border-color:#b42318}
.q{color:#9a6400;font-weight:600}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.btn.danger{background:#b42318;border-color:#b42318;margin-top:var(--s3)}
</style>
</head>
<body>
<header class="band"><div class="wrap hd"><img src="/img/seal.webp" width="40" height="50" alt=""><div><h1>Admin Quick Count Pilkades Wonogiri</h1><a class="lnk" href="/">Lihat dashboard</a></div><div class="hr" id="hr" hidden><span class="sync" id="sync" role="status" aria-live="polite"><i></i><span id="synct">Semua tersimpan</span></span><button class="btn out" id="out" type="button">Keluar</button></div></div></header>
<div class="fail" id="fail" role="alert" hidden><div class="wrap"><span id="failt"></span><button class="btn" id="retry" type="button">Coba simpan lagi</button></div></div>
<main><div class="wrap">
<div class="card" id="login">
<label>Kunci admin<input type="password" id="key" autocomplete="current-password"></label>
<label class="ck"><input type="checkbox" id="rem" checked> Tetap masuk di perangkat ini selama 14 hari</label>

<button class="btn" id="go" type="button">Masuk</button>
</div>
<div id="work" hidden>
<div class="tabs" role="tablist" aria-label="Menu admin">
<button role="tab" data-t="v" aria-selected="true" type="button">Input suara</button>
<button role="tab" data-t="c" aria-selected="false" type="button">Calon dan foto</button>
<button role="tab" data-t="p" aria-selected="false" type="button">Pengaturan</button>
</div>
<div class="card row2" id="sel">
<label>Kecamatan<select id="fk"></select></label>
<label>Desa<select id="fd"></select></label>
</div>
<section id="tv" role="tabpanel"><p class="st" id="sum"></p><div class="card" id="vform"></div></section>
<section id="tc" role="tabpanel" hidden>
<div class="card"><h2>Tambah calon</h2>
<div class="f"><label>Kecamatan<input id="ak" list="kl" type="text"></label><label>Desa<input id="ad" list="dl" type="text"></label>
<label class="nmf">Nama calon<input id="an" type="text" maxlength="80"></label>
<label class="ck"><input type="checkbox" id="ap"> Petahana</label>
<button class="btn" id="addb" type="button">Tambah</button></div>
<p class="st" id="addm" role="status"></p><datalist id="kl"></datalist><datalist id="dl"></datalist></div>
<div id="list"></div></section>
<section id="tp" role="tabpanel" hidden>
<div class="card"><h2>Kosongkan semua suara</h2>
<p>Menghapus semua suara dan mengembalikan status semua desa ke "Belum masuk". Pakai setelah uji coba. Riwayat perubahan tetap ada di sheet Log.</p>
<label>Ketik RESET untuk konfirmasi<input id="rc" type="text" autocomplete="off"></label>
<button class="btn danger" id="rb" type="button">Kosongkan semua suara</button><p class="st" id="rm" role="status"></p></div>
</section>
</div>
</div></main>
<script>
function proper(s){s=String(s||'').trim().replace(/\s+/g,' ');if(!s)return s;const i=s.indexOf(','),main=i<0?s:s.slice(0,i),deg=i<0?'':s.slice(i);return main.toLocaleLowerCase('id-ID').replace(/(^|[\s.\-(\/])(\p{L})/gu,(m,a,b)=>a+b.toLocaleUpperCase('id-ID'))+deg}
const $=id=>document.getElementById(id);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
let KEY='',SES='';
const SK='qc-admin';
const ls={get(){try{return JSON.parse(localStorage.getItem(SK)||sessionStorage.getItem(SK)||'null')}catch(e){return null}},
 set(v,rem){try{(rem?localStorage:sessionStorage).setItem(SK,JSON.stringify(v))}catch(e){}},
 clear(){try{localStorage.removeItem(SK);sessionStorage.removeItem(SK)}catch(e){}}};
const MAXB=40*1024,W=240;
const RAT={'4x6':[4,6],'3x4':[3,4],'1x1':[1,1]},AR={'4x6':'2/3','3x4':'3/4','1x1':'1/1'},RL={'4x6':'4 x 6 (potret)','3x4':'3 x 4','1x1':'1 x 1 (persegi)'};
const call=(fn,data)=>fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fn,key:SES?'':KEY,session:SES||undefined,data})}).then(r=>r.json());
const expired=r=>r&&(r.error==='session'||r.error==='unauthorized');
const toBlob=(c,q)=>new Promise(r=>c.toBlob(r,'image/jpeg',q));
const toB64=bl=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=no;r.readAsDataURL(bl)});
// Editor foto: geser untuk memposisikan, roda/slider untuk memperbesar, putar 90° atau miring halus, grid sepertiga.
// Hasil dikompres sampai <= 40 KB.
async function makeEditor(file,rasio){
 let bmp;try{bmp=await createImageBitmap(file,{imageOrientation:'from-image'})}catch(e){bmp=await createImageBitmap(file)}
 const iw=bmp.width,ih=bmp.height,dpr=Math.min(2,window.devicePixelRatio||1);
 const wrap=el('div','ed'),stage=el('div','stg'),cv=el('canvas'),tools=el('div','edt');
 cv.tabIndex=0;cv.setAttribute('role','img');cv.setAttribute('aria-label','Pratinjau potongan foto. Geser dengan mouse, jari, atau tombol panah.');
 const mk=(lab,min,max,step,val)=>{const l=el('label','rg'),t=el('span',null,lab),o=el('output'),i=el('input');i.type='range';i.min=min;i.max=max;i.step=step;i.value=val;l.append(t,i,o);return{l,i,o}};
 const Z=mk('Perbesar',1,4,.01,1),A=mk('Miring',-45,45,.5,0);
 const bt=(t,lab,fn)=>{const b=el('button','btn alt sm',t);b.type='button';b.setAttribute('aria-label',lab);b.onclick=fn;return b};
 const gridB=bt('Grid','Tampilkan atau sembunyikan grid',()=>{grid=!grid;gridB.setAttribute('aria-pressed',String(grid));draw()});
 const row=el('div','edb');
 row.append(bt('⟲ 90°','Putar 90 derajat ke kiri',()=>{quarter=(quarter+3)%4;fit()}),bt('⟳ 90°','Putar 90 derajat ke kanan',()=>{quarter=(quarter+1)%4;fit()}),gridB,bt('Atur ulang','Kembalikan posisi, perbesaran, dan putaran awal',()=>{quarter=0;fine=0;zoom=1;A.i.value=0;Z.i.value=1;px=0;py=0;fit()}));
 tools.append(Z.l,A.l,row);
 stage.append(cv);wrap.append(stage,tools,el('p','st','Geser foto untuk mengatur potongan. Garis bantu membagi foto menjadi tiga bagian.'));
 let r=rasio,W=260,H,zoom=1,quarter=0,fine=0,px=0,py=0,grid=true,drag=false,ptr=new Map(),pinch=null;
 const ang=()=>(quarter*90+fine)*Math.PI/180;
 const base=()=>{const a=ang(),c=Math.abs(Math.cos(a)),s=Math.abs(Math.sin(a));return Math.max((W*c+H*s)/iw,(W*s+H*c)/ih)};
 const sc=()=>base()*zoom;
 const dims=()=>{const[a,b]=RAT[r];H=Math.round(W*b/a);cv.width=W*dpr;cv.height=H*dpr;cv.style.aspectRatio=W+'/'+H};
 // jaga agar bingkai selalu tertutup foto: posisi pusat bingkai di koordinat foto dibatasi
 const clamp=()=>{const a=ang(),s=sc(),c=Math.abs(Math.cos(a)),n=Math.abs(Math.sin(a));
  const hx=(W*c+H*n)/(2*s),hy=(W*n+H*c)/(2*s),cos=Math.cos(-a),sin=Math.sin(-a);
  let ux=(-px*cos+py*sin)/s,uy=(-px*sin-py*cos)/s;                     // pusat bingkai di ruang foto
  ux=Math.max(-(iw/2-hx),Math.min(iw/2-hx,ux));uy=Math.max(-(ih/2-hy),Math.min(ih/2-hy,uy));
  const c2=Math.cos(a),s2=Math.sin(a);px=-(ux*c2-uy*s2)*s;py=-(ux*s2+uy*c2)*s};
 const paint=(ctx,k)=>{ctx.setTransform(k,0,0,k,0,0);ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
  ctx.imageSmoothingQuality='high';ctx.translate(W/2+px,H/2+py);ctx.rotate(ang());const s=sc();ctx.scale(s,s);ctx.drawImage(bmp,-iw/2,-ih/2)};
 const draw=()=>{const x=cv.getContext('2d');paint(x,dpr);
  if(!grid&&!drag)return;x.setTransform(dpr,0,0,dpr,0,0);x.lineWidth=1;
  x.strokeStyle=drag?'rgba(255,255,255,.95)':'rgba(255,255,255,.75)';x.shadowColor='rgba(0,0,0,.45)';x.shadowBlur=2;x.beginPath();
  for(const f of [1/3,2/3]){x.moveTo(Math.round(W*f)+.5,0);x.lineTo(Math.round(W*f)+.5,H);x.moveTo(0,Math.round(H*f)+.5);x.lineTo(W,Math.round(H*f)+.5)}
  x.stroke();if(drag&&fine){x.strokeStyle='rgba(255,255,255,.35)';x.beginPath();for(let i=1;i<6;i++){if(i%2===0)continue;x.moveTo(W*i/6+.5,0);x.lineTo(W*i/6+.5,H);x.moveTo(0,H*i/6+.5);x.lineTo(W,H*i/6+.5)}x.stroke()}};
 const fit=()=>{clamp();draw();Z.o.textContent=zoom.toFixed(2)+'×';A.o.textContent=(fine>0?'+':'')+fine+'°'+(quarter?' (+'+quarter*90+'°)':'')};
 dims();py=-(0)*1;fit();gridB.setAttribute('aria-pressed','true');
 // posisi awal sedikit ke atas (wajah biasanya di bagian atas foto)
 {const s=sc(),room=Math.max(0,ih*s-H)/2;py=room*.7;fit()}
 Z.i.oninput=()=>{zoom=+Z.i.value;fit()};
 A.i.oninput=()=>{fine=+A.i.value;drag=true;fit()};A.i.onchange=A.i.onpointerup=()=>{drag=false;draw()};
 const kz=()=>W/cv.getBoundingClientRect().width;
 cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,[e.clientX,e.clientY]);drag=true;
  if(ptr.size===2){const[p1,p2]=[...ptr.values()];pinch={d:Math.hypot(p1[0]-p2[0],p1[1]-p2[1]),z:zoom}}draw()};
 cv.onpointermove=e=>{if(!ptr.has(e.pointerId))return;const pv=ptr.get(e.pointerId);ptr.set(e.pointerId,[e.clientX,e.clientY]);
  if(ptr.size===2&&pinch){const[p1,p2]=[...ptr.values()];zoom=Math.max(1,Math.min(4,pinch.z*Math.hypot(p1[0]-p2[0],p1[1]-p2[1])/pinch.d));Z.i.value=zoom;fit();return}
  const k=kz();px+=(e.clientX-pv[0])*k;py+=(e.clientY-pv[1])*k;fit()};
 cv.onpointerup=cv.onpointercancel=e=>{ptr.delete(e.pointerId);if(ptr.size<2)pinch=null;if(!ptr.size){drag=false;draw()}};
 cv.onwheel=e=>{e.preventDefault();zoom=Math.max(1,Math.min(4,zoom*(e.deltaY<0?1.08:1/1.08)));Z.i.value=zoom;fit()};
 cv.onkeydown=e=>{const m={ArrowLeft:[-4,0],ArrowRight:[4,0],ArrowUp:[0,-4],ArrowDown:[0,4]}[e.key];if(!m)return;e.preventDefault();px+=m[0]*(e.shiftKey?4:1);py+=m[1]*(e.shiftKey?4:1);fit()};
 return{el:wrap,setRatio(n){r=n;dims();fit()},
  async out(){const[a,b]=RAT[r];
   for(const L of [480,400,320,260,200,160,128]){
    const ow=a>=b?L:Math.round(L*a/b),oh=a>=b?Math.round(L*b/a):L,c=document.createElement('canvas');c.width=ow;c.height=oh;
    paint(c.getContext('2d'),ow/W);
    for(let q=.85;q>=.35;q-=.1){const bl=await toBlob(c,q);if(bl.size<=MAXB)return{blob:bl,b64:await toB64(bl)}}}
   throw new Error('size')}}}

const STAT=['Belum masuk','Sementara','Final'];
const TFA=new Intl.DateTimeFormat('id-ID',{timeZone:'Asia/Jakarta',day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'});
function tsA(ms){const p={};TFA.formatToParts(new Date(ms)).forEach(x=>p[x.type]=x.value);return p.day+' '+p.month+' '+p.year+', '+p.hour+':'+p.minute+':'+p.second}
let S={calon:[],desa:[]},TAB='v',FLASH='';
const nf=n=>n==null||n===''?'':Number(n).toLocaleString('id-ID');
const act=(k,d)=>S.calon.filter(c=>c.kecamatan===k&&c.desa===d&&c.aktif).sort((a,b)=>(+a.nomor_urut||99)-(+b.nomor_urut||99));
const inf=(k,d)=>S.desa.find(x=>x.kecamatan===k&&x.desa===d)||{status:STAT[0],updated:0};
const opt=(t,v)=>{const o=el('option',null,t);o.value=v;return o};
async function run(fn,data,m){m.className='st';m.textContent='Menyimpan...';
 try{const r=await call(fn,data);
  if(r.error){if(expired(r)){logout('Sesi berakhir. Masuk lagi dengan kunci admin.');return null}m.textContent=r.error;return null}
  S={calon:r.calon,desa:r.desa};return r}
 catch(e){m.textContent='Gagal terhubung. Coba lagi.';return null}}
function enter(r){S={calon:r.calon,desa:r.desa};$('login').hidden=true;$('work').hidden=false;$('hr').hidden=false;$('key').value='';KEY='';fillK()}
$('go').onclick=async()=>{KEY=$('key').value;SES='';if(!KEY){$('msg').textContent='Isi kunci admin.';return}
 $('go').disabled=true;$('msg').className='st';$('msg').textContent='Memuat...';
 try{const r=await call('login');
  if(r.error){$('msg').textContent=r.error==='unauthorized'?'Kunci admin salah, atau terkunci 10 menit setelah 10 kali salah.':r.error;return}
  if(r.session){SES=r.session;ls.set({session:r.session,exp:r.exp},$('rem').checked)}
  enter(r)}catch(e){$('msg').textContent='Gagal terhubung. Periksa internet, lalu coba lagi.'}
 finally{$('go').disabled=false}};
function logout(msg){const s=SES;SES='';KEY='';ls.clear();
 if(s)fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fn:'logout',session:s})}).catch(()=>{});
 $('work').hidden=true;$('hr').hidden=true;$('login').hidden=false;$('msg').className='st';$('msg').textContent=msg||'';$('key').focus()}
$('out').onclick=()=>{if(PEND.size&&!confirm('Masih ada data yang sedang disimpan. Tetap keluar?'))return;logout('Anda sudah keluar.')};
(async()=>{const v=ls.get();if(!v||!v.session||v.exp<Date.now()){ls.clear();return}
 SES=v.session;$('msg').className='st';$('msg').textContent='Membuka panel admin...';$('go').disabled=true;
 try{const r=await call('list');if(expired(r)){logout('Sesi berakhir. Masuk lagi dengan kunci admin.');return}
  if(r.error){$('msg').textContent=r.error;return}enter(r);$('msg').textContent=''}
 catch(e){$('msg').textContent='Gagal terhubung. Muat ulang halaman untuk mencoba lagi.'}
 finally{$('go').disabled=false}})();
$('key').onkeydown=e=>{if(e.key==='Enter')$('go').click()};
function fillK(k,d){const ks=[...new Set(S.calon.map(c=>c.kecamatan))];
 $('fk').replaceChildren(...ks.map(x=>opt(x,x)));if(k&&ks.includes(k))$('fk').value=k;
 $('kl').replaceChildren(...ks.map(x=>opt('',x)));$('dl').replaceChildren(...[...new Set(S.calon.map(c=>c.desa))].map(x=>opt('',x)));fillD(d)}
function fillD(d){const k=$('fk').value,ds=S.desa.filter(x=>x.kecamatan===k);
 $('fd').replaceChildren(...ds.map(x=>opt(dlabel(x),x.desa)));if(d&&ds.some(x=>x.desa===d))$('fd').value=d;show()}
$('fk').onchange=()=>fillD();$('fd').onchange=show;
document.querySelectorAll('[role=tab]').forEach(b=>b.onclick=()=>{TAB=b.dataset.t;
 document.querySelectorAll('[role=tab]').forEach(x=>x.setAttribute('aria-selected',String(x===b)));
 ['v','c','p'].forEach(t=>$('t'+t).hidden=t!==TAB);$('sel').hidden=TAB==='p';show()});
function show(){const c={};S.desa.forEach(x=>c[x.status]=(c[x.status]||0)+1);
 $('sum').textContent='Final '+(c.Final||0)+' · Sementara '+(c.Sementara||0)+' · Belum masuk '+(c['Belum masuk']||0)+' dari '+S.desa.length+' desa';
 if(TAB==='v')vote();if(TAB==='c')cards()}
function vote(){
 const k=$('fk').value,d=$('fd').value,cs=act(k,d),i=inf(k,d),box=$('vform');
 if(!cs.length){box.replaceChildren(el('p','st','Desa ini belum punya calon aktif. Tambahkan atau aktifkan di tab Calon dan foto.'));return}
 const ins=[],pcs=[],tot=el('b','','0'),m=el('p','st',FLASH);m.dataset.msg='1';if(FLASH)m.className='st q';FLASH='';
 if(!FLASH&&FAIL[k+'|'+d]){m.className='st';m.textContent='Belum tersimpan: '+FAIL[k+'|'+d].error}
 const rowsEl=cs.map((c,n)=>{const r=el('div','vr'),lb=el('label','vl'),x=el('input'),p=el('span','pc');
  x.type='number';x.min='0';x.step='1';x.inputMode='numeric';x.value=c.suara==null?'':c.suara;x.dataset.id=c.id;
  x.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();(ins[n+1]||b1).focus()}};
  ins.push(x);pcs.push(p);lb.append(el('span','vn',c.nomor_urut||'-'),el('span','',proper(c.nama)+(c.petahana?' (petahana)':'')),x);r.append(lb,p);return r});
 const sl=el('label','','Status desa'),st=el('select');STAT.forEach(s=>st.append(opt(s,s)));st.value=i.status;sl.append(st);
 const calc=()=>{const t=ins.reduce((a,x)=>a+(+x.value||0),0);tot.textContent=nf(t);
  ins.forEach((x,n)=>pcs[n].textContent=x.value!==''&&t>0?(+x.value/t*100).toFixed(2)+'%':'');
  if(st.value===STAT[0]&&ins.some(x=>x.value!==''))st.value=STAT[1]};
 ins.forEach(x=>x.oninput=calc);
 const b1=el('button','btn','Simpan'),b2=el('button','btn alt','Simpan dan lanjut ke desa berikutnya');b1.type=b2.type='button';
 const save=async next=>{b1.disabled=b2.disabled=true;const suara={};ins.forEach(x=>suara[x.dataset.id]=x.value.trim());
  b1.disabled=b2.disabled=false;
  for(const c of cs){const v=suara[c.id];if(v!==''&&!/^\d{1,6}$/.test(v)){m.className='st';m.textContent='Suara '+proper(c.nama)+' harus angka bulat, 0 atau lebih.';return}}
  if(st.value===STAT[2]&&cs.some(c=>suara[c.id]==='')){m.className='st';m.textContent='Status Final butuh suara semua calon terisi.';return}
  enqueue({kecamatan:k,desa:d,status:st.value,suara});
  FLASH='Sedang disimpan di latar belakang. Anda bisa lanjut mengisi.';
  if(next){const idx=S.desa.findIndex(x=>x.kecamatan===k&&x.desa===d),nx=S.desa.slice(idx+1).concat(S.desa.slice(0,idx)).find(x=>x.status===STAT[0]);
   if(nx){FLASH='Desa '+d+' disimpan di latar belakang. Silakan isi desa ini.';fillK(nx.kecamatan,nx.desa);return}FLASH='Sedang disimpan di latar belakang. Semua desa sudah terisi.'}
  fillK(k,d)};
 b1.onclick=()=>save(false);b2.onclick=()=>save(true);
 const tr=el('div','vr');tr.append(el('span','vl','Total suara'),tot);
 const bt=el('div','btns');bt.append(b1,b2);
 box.replaceChildren(el('p','nm',d+' · Kec. '+k),el('p','st','Terakhir diperbarui: '+(i.updated?tsA(i.updated)+' WIB':'belum ada')),
  ...rowsEl,tr,sl,bt,m);calc()}
/* ---------- Antrean simpan suara: admin langsung lanjut, penyimpanan berjalan di belakang ---------- */
const QUEUE=[],PEND=new Set(),FAIL={};let RUN=false;
function applyLocal(j){const any=Object.values(j.suara).some(v=>v!=='');let st=j.status;if(!any)st=STAT[0];else if(st===STAT[0])st=STAT[1];
 S.calon.forEach(c=>{if(c.kecamatan===j.kecamatan&&c.desa===j.desa&&j.suara.hasOwnProperty(c.id))c.suara=j.suara[c.id]===''?null:+j.suara[c.id]});
 const x=S.desa.find(x=>x.kecamatan===j.kecamatan&&x.desa===j.desa);if(x){x.status=st;x.updated=Date.now()}}
function enqueue(j){const key=j.kecamatan+'|'+j.desa;
 for(let i=QUEUE.length-1;i>=0;i--)if(!QUEUE[i].sent&&QUEUE[i].kecamatan+'|'+QUEUE[i].desa===key)QUEUE.splice(i,1);   // simpan ulang desa sama: pakai yang terbaru
 delete FAIL[key];PEND.add(key);applyLocal(j);QUEUE.push(j);syncUI();pump()}
async function pump(){if(RUN)return;RUN=true;
 while(QUEUE.length){const j=QUEUE[0],key=j.kecamatan+'|'+j.desa;j.sent=true;let r=null,err='';
  try{r=await call('saveVotes',{kecamatan:j.kecamatan,desa:j.desa,status:j.status,suara:j.suara})}catch(e){err='Gagal terhubung'}
  QUEUE.shift();
  if(r&&expired(r)){QUEUE.unshift(j);j.sent=false;RUN=false;syncUI();logout('Sesi berakhir. Masuk lagi untuk menyimpan '+QUEUE.length+' desa yang tertunda.');return}
  if(r&&r.ok){const x=S.desa.find(x=>x.kecamatan===r.kecamatan&&x.desa===r.desa);if(x){x.status=r.status;x.updated=r.updated}
   S.calon.forEach(c=>{if(r.suara&&r.suara.hasOwnProperty(c.id))c.suara=r.suara[c.id]});
   if(!QUEUE.some(q=>q.kecamatan+'|'+q.desa===key))PEND.delete(key)}
  else{FAIL[key]={job:Object.assign({},j,{sent:false}),error:(r&&r.error)||err||'Gagal menyimpan'};if(!QUEUE.some(q=>q.kecamatan+'|'+q.desa===key))PEND.delete(key)}
  syncUI(true)}
 RUN=false}
function dlabel(x){const k=x.kecamatan+'|'+x.desa;return x.desa+'  ('+x.status+')'+(FAIL[k]?' · GAGAL DISIMPAN':PEND.has(k)?' · menyimpan…':'')}
function relabel(){const k=$('fk').value;[...$('fd').options].forEach(o=>{const x=S.desa.find(x=>x.kecamatan===k&&x.desa===o.value);if(x)o.textContent=dlabel(x)})}
function syncUI(done){const n=PEND.size,f=Object.keys(FAIL),el2=$('sync');
 el2.className='sync'+(n?' busy':f.length?' bad':'');
 $('synct').textContent=n?'Menyimpan '+n+' desa…':f.length?f.length+' desa gagal':'Semua tersimpan';
 $('fail').hidden=!f.length;
 if(f.length)$('failt').textContent='Belum tersimpan: '+f.map(k=>k.split('|')[1]+' ('+FAIL[k].error+')').join(', ');
 relabel();
 const k=$('fk').value,d=$('fd').value,m=document.querySelector('#vform [data-msg]');   // pesan di form desa yang sedang dibuka, tanpa menggambar ulang form
 if(m&&m.textContent.startsWith('Sedang')&&!PEND.has(k+'|'+d)){if(FAIL[k+'|'+d]){m.className='st';m.textContent='Gagal disimpan: '+FAIL[k+'|'+d].error}else{m.className='st ok';m.textContent='Tersimpan.'}}}
$('retry').onclick=()=>{Object.values(FAIL).map(x=>x.job).forEach(enqueue)};
['dragover','drop'].forEach(t=>addEventListener(t,e=>{if(e.dataTransfer&&[...e.dataTransfer.types].includes('Files'))e.preventDefault()}));
addEventListener('beforeunload',e=>{if(PEND.size){e.preventDefault();e.returnValue=''}});
function cards(){const k=$('fk').value,d=$('fd').value;
 $('list').replaceChildren(...S.calon.filter(c=>c.kecamatan===k&&c.desa===d).map(card))}
function card(it){
 const c=el('div','card cal'),ph=el('div','ph',it.nama.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase());
 ph.style.setProperty('--ar',AR[it.rasio]||'2/3');
 const show=u=>{ph.querySelector('img')?.remove();const im=new Image();im.src=u;im.alt='Foto '+it.nama;im.onerror=()=>im.remove();ph.append(im)};
 if(it.foto)show(it.foto);
 const b=el('div'),f=el('div','f'),st=el('p','st');st.setAttribute('role','status');
 const ml=el('label','nmf','Nama calon'),nm=el('input');nm.type='text';nm.maxLength=80;nm.value=proper(it.nama);ml.append(nm);
 const nl=el('label','nu','Nomor urut'),num=el('input');num.type='number';num.min='1';num.max='99';num.value=it.nomor_urut||'';nl.append(num);
 const rl=el('label','rs','Rasio foto'),rs=el('select');Object.keys(RAT).forEach(x=>rs.append(opt(RL[x],x)));rs.value=it.rasio||'4x6';rl.append(rs);
 const fl=el('label','drop'),file=el('input');file.type='file';file.accept='image/*';
 fl.innerHTML='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg><span><b>Pilih foto</b> atau seret ke kartu ini · bisa juga tempel (Ctrl+V)</span>';
 fl.append(file);
 const pl=el('label','ck'),pe=el('input');pe.type='checkbox';pe.checked=it.petahana;pl.append(pe,' Petahana');
 const al=el('label','ck'),ae=el('input');ae.type='checkbox';ae.checked=it.aktif;al.append(ae,' Aktif (tampil di dashboard)');
 const btn=el('button','btn','Simpan');btn.type='button';
 let ed=null;
 const load=async f=>{if(!f)return;st.className='st';
  if(!/^image\//.test(f.type)&&!/\.(jpe?g|png|webp|heic|heif)$/i.test(f.name||'')){st.textContent='File itu bukan foto. Gunakan JPG atau PNG.';return}
  st.textContent='Membuka foto...';
  try{const nx=await makeEditor(f,rs.value);if(ed)ed.el.remove();ed=nx;b.insertBefore(ed.el,st);st.textContent='';ed.el.querySelector('canvas').focus({preventScroll:true});ed.el.scrollIntoView({block:'nearest',behavior:'smooth'})}
  catch(e){st.textContent=/heic|heif/i.test(f.type+f.name)?'Foto HEIC dari iPhone belum bisa dibuka. Ubah ke JPG dulu, atau kirim lewat WhatsApp lalu simpan.':'Gagal membaca foto. Gunakan JPG atau PNG.'}};
 file.onchange=()=>load(file.files[0]);
 let dd=0;
 c.addEventListener('dragenter',e=>{if(![...e.dataTransfer.types].includes('Files'))return;e.preventDefault();dd++;c.classList.add('dragging')});
 c.addEventListener('dragover',e=>{if(![...e.dataTransfer.types].includes('Files'))return;e.preventDefault();e.dataTransfer.dropEffect='copy'});
 c.addEventListener('dragleave',()=>{if(--dd<=0){dd=0;c.classList.remove('dragging')}});
 c.addEventListener('drop',e=>{e.preventDefault();dd=0;c.classList.remove('dragging');const f=[...e.dataTransfer.files].find(x=>/^image\//.test(x.type))||e.dataTransfer.files[0];load(f)});
 c.tabIndex=-1;c.addEventListener('paste',e=>{const it2=[...(e.clipboardData||{}).items||[]].find(x=>x.kind==='file'&&/^image\//.test(x.type));if(it2){e.preventDefault();load(it2.getAsFile())}});
 c.addEventListener('pointerdown',e=>{if(!e.target.closest('input,select,button,canvas,label'))c.focus({preventScroll:true})});
 rs.onchange=()=>{ph.style.setProperty('--ar',AR[rs.value]);if(ed)ed.setRatio(rs.value)};
 btn.onclick=async()=>{btn.disabled=true;
  const data={id:it.id,nama:proper(nm.value),petahana:pe.checked,aktif:ae.checked,nomor_urut:num.value.trim(),rasio:rs.value};let kb='';
  try{if(ed){const o=await ed.out();data.foto_b64=o.b64;kb=' Foto dikompres menjadi '+Math.max(1,Math.round(o.blob.size/1024))+' KB.';show(URL.createObjectURL(o.blob))}
   const r=await run('saveCalon',data,st);
   if(r){st.textContent='Tersimpan.'+kb;st.className='st ok';if(ed){ed.el.remove();ed=null;file.value=''}}
  }catch(e){st.textContent=e.message==='size'?'Foto tidak bisa dikecilkan sampai 40 KB. Coba foto lain.':'Gagal memproses foto. Gunakan JPG atau PNG.'}
  btn.disabled=false};
 f.append(ml,nl,rl,fl,pl,al,btn);b.append(f,st);c.append(ph,b);return c}
$('addb').onclick=async()=>{const k=$('ak').value.trim().toUpperCase(),d=$('ad').value.trim().toUpperCase(),m=$('addm');
 const r=await run('addCalon',{kecamatan:k,desa:d,nama:proper($('an').value),petahana:$('ap').checked},m);
 if(r){$('an').value='';$('ap').checked=false;fillK(k,d);m.textContent='Calon ditambahkan ke desa '+d+'.';m.className='st ok'}};
$('rb').onclick=async()=>{const m=$('rm'),r=await run('reset',{confirm:$('rc').value.trim()},m);
 if(r){$('rc').value='';m.textContent='Semua suara dikosongkan.';m.className='st ok';fillK($('fk').value,$('fd').value)}};
