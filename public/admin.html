<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/img/favicon.png" type="image/png">
<title>Admin Quick Count Pilkades Wonogiri 2026</title>
<style>
:root{color-scheme:light;--bg:#f1f4f5;--card:#fff;--ink:#1d1b17;--mut:#645f57;--line:rgba(29,27,23,.14);--acc:#b5121b;--fin:#16794a;--r-sm:8px;--r-lg:12px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s7:48px}
*{box-sizing:border-box}
html,body{margin:0}
@font-face{font-family:"Jakarta";src:url(/fonts/jakarta.woff2) format("woff2");font-weight:200 800;font-display:swap}
body{background:var(--bg);color:var(--ink);font:16px/1.6 "Jakarta",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:0 clamp(16px,5vw,48px)}
.band{background:var(--acc);color:#fff;padding:var(--s5) 0;border-bottom:4px solid #d4b34a}.hd{display:flex;align-items:center;gap:var(--s4)}.hd img{flex:none;height:auto}
h1{margin:0;font-size:clamp(22px,3vw,28px);line-height:1.2;letter-spacing:-.02em;font-weight:600}
main{padding:var(--s5) 0 var(--s7)}
:focus-visible{outline:3px solid #e8a33d;outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--s5);margin-bottom:var(--s4)}
label{display:grid;gap:4px;font-size:13px;font-weight:500;color:var(--mut)}
select,input[type=password],input[type=number]{min-height:44px;border:1px solid var(--line);border-radius:var(--r-sm);font:inherit;color:var(--ink);background:var(--card);padding:0 var(--s4);width:100%}
input[type=range]{width:240px;max-width:100%;min-height:44px}
.btn{min-height:44px;padding:0 var(--s5);border:1px solid var(--ink);border-radius:var(--r-sm);background:var(--ink);color:#fff;font:inherit;font-weight:500;cursor:pointer;transition:transform .1s,opacity .15s}
.btn:hover{opacity:.88}.btn:active{transform:translateY(1px)}.btn:disabled{opacity:.5;cursor:wait}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4)}
.cal{display:grid;grid-template-columns:72px 1fr;gap:var(--s4);align-items:start}
.ph{position:relative;width:72px;aspect-ratio:var(--ar,2/3);border-radius:var(--r-sm);background:rgba(29,27,23,.08);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--mut);font-weight:600}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.nm{font-weight:600;margin:0 0 var(--s2)}
.f{display:flex;flex-wrap:wrap;gap:var(--s3);align-items:flex-end}
.f .nu{width:110px}.f .rs{width:130px}
.ed{margin:var(--s3) 0}
.ed canvas{display:block;width:240px;max-width:100%;height:auto;border:1px solid var(--line);border-radius:var(--r-sm);cursor:grab;touch-action:none}
.st{min-height:1.6em;margin:var(--s2) 0 0;color:var(--mut)}
.st.ok{color:var(--fin)}
[hidden]{display:none!important}
@media (max-width:560px){.row2{grid-template-columns:1fr}}

input[type=text]{min-height:44px;border:1px solid var(--line);border-radius:var(--r-sm);font:inherit;color:var(--ink);background:var(--card);padding:0 var(--s4);width:100%}
h2{margin:0 0 var(--s3);font-size:20px;line-height:1.3;font-weight:600}
.lnk{color:#fff;display:inline-block;margin-top:var(--s2)}
.tabs{display:flex;flex-wrap:wrap;gap:var(--s2);margin-bottom:var(--s4)}
.tabs button{min-height:44px;padding:0 var(--s4);border:1px solid var(--line);border-radius:99px;background:var(--card);font:inherit;font-weight:500;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.vr{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);padding:var(--s3) 0;border-top:1px solid var(--line)}
.vl{display:flex;align-items:center;gap:var(--s3);flex:1;flex-wrap:wrap;color:var(--ink);font-size:16px;font-weight:500}
.vl input{width:130px;font-size:18px}
.vn{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;border-radius:99px;background:var(--ink);color:#fff;font-size:13px;font-weight:600}
.pc{min-width:64px;text-align:right;color:var(--mut);font-variant-numeric:tabular-nums}
.ck{display:flex;align-items:center;gap:var(--s2);min-height:44px;font-size:16px;color:var(--ink)}
.ck input{width:20px;height:20px}
.f .nmf{width:220px}
.btns{display:flex;flex-wrap:wrap;gap:var(--s3);margin-top:var(--s4)}
.btn.alt{background:transparent;color:var(--ink)}
.btn.danger{background:#b42318;border-color:#b42318;margin-top:var(--s3)}
</style>
</head>
<body>
<header class="band"><div class="wrap hd"><img src="/img/seal.webp" width="40" height="50" alt=""><div><h1>Admin Quick Count Pilkades Wonogiri</h1><a class="lnk" href="/">Lihat dashboard</a></div></div></header>
<main><div class="wrap">
<div class="card" id="login">
<label>Kunci admin<input type="password" id="key" autocomplete="current-password"></label>
<p class="st" id="msg" role="status"></p>
<button class="btn" id="go" type="button">Masuk</button>
</div>
<div id="work" hidden>
<div class="tabs" role="tablist" aria-label="Menu admin">
<button role="tab" data-t="v" aria-selected="true" type="button">Input suara</button>
<button role="tab" data-t="c" aria-selected="false" type="button">Calon dan foto</button>
<button role="tab" data-t="p" aria-selected="false" type="button">Pengaturan</button>
</div>
<div class="card row2" id="sel">
<label>Kecamatan<select id="fk"></select></label>
<label>Desa<select id="fd"></select></label>
</div>
<section id="tv" role="tabpanel"><p class="st" id="sum"></p><div class="card" id="vform"></div></section>
<section id="tc" role="tabpanel" hidden>
<div class="card"><h2>Tambah calon</h2>
<div class="f"><label>Kecamatan<input id="ak" list="kl" type="text"></label><label>Desa<input id="ad" list="dl" type="text"></label>
<label class="nmf">Nama calon<input id="an" type="text" maxlength="80"></label>
<label class="ck"><input type="checkbox" id="ap"> Petahana</label>
<button class="btn" id="addb" type="button">Tambah</button></div>
<p class="st" id="addm" role="status"></p><datalist id="kl"></datalist><datalist id="dl"></datalist></div>
<div id="list"></div></section>
<section id="tp" role="tabpanel" hidden>
<div class="card"><h2>Kosongkan semua suara</h2>
<p>Menghapus semua suara dan mengembalikan status semua desa ke "Belum masuk". Pakai setelah uji coba. Riwayat perubahan tetap ada di sheet Log.</p>
<label>Ketik RESET untuk konfirmasi<input id="rc" type="text" autocomplete="off"></label>
<button class="btn danger" id="rb" type="button">Kosongkan semua suara</button><p class="st" id="rm" role="status"></p></div>
</section>
</div>
</div></main>
<script>
function proper(s){s=String(s||'').trim().replace(/\s+/g,' ');if(!s)return s;const i=s.indexOf(','),main=i<0?s:s.slice(0,i),deg=i<0?'':s.slice(i);return main.toLocaleLowerCase('id-ID').replace(/(^|[\s.\-(\/])(\p{L})/gu,(m,a,b)=>a+b.toLocaleUpperCase('id-ID'))+deg}
const $=id=>document.getElementById(id);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
let KEY='';
const MAXB=40*1024,W=240;
const RAT={'4x6':[4,6],'3x4':[3,4],'1x1':[1,1]},AR={'4x6':'2/3','3x4':'3/4','1x1':'1/1'},RL={'4x6':'4 x 6 (potret)','3x4':'3 x 4','1x1':'1 x 1 (persegi)'};
const call=(fn,data)=>fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fn,key:KEY,data})}).then(r=>r.json());
const toBlob=(c,q)=>new Promise(r=>c.toBlob(r,'image/jpeg',q));
const toB64=bl=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=no;r.readAsDataURL(bl)});
// Editor potong: geser untuk memposisikan, slider untuk memperbesar; hasil dikompres sampai <= 40 KB
async function makeEditor(file,rasio){
 const bmp=await createImageBitmap(file),iw=bmp.width,ih=bmp.height;
 const wrap=el('div','ed'),cv=el('canvas'),zl=el('label','','Perbesar'),zm=el('input');
 zm.type='range';zm.min='1';zm.max='3';zm.step='0.01';zm.value='1';zl.append(zm);
 wrap.append(cv,zl,el('p','st','Geser foto untuk mengatur potongan.'));
 let r=rasio,H,base,s,ox,oy,zoom=1;
 const dims=()=>{const[a,b]=RAT[r];H=Math.round(W*b/a);cv.width=W;cv.height=H;base=Math.max(W/iw,H/ih)};
 const clamp=()=>{ox=Math.min(0,Math.max(W-iw*s,ox));oy=Math.min(0,Math.max(H-ih*s,oy))};
 const draw=()=>{const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,H);x.drawImage(bmp,ox,oy,iw*s,ih*s)};
 const keep=fn=>{const cx=(W/2-ox)/s,cy=(H/2-oy)/s;fn();s=base*zoom;ox=W/2-cx*s;oy=H/2-cy*s;clamp();draw()};
 dims();s=base;ox=(W-iw*s)/2;oy=(H-ih*s)*.15;clamp();draw();
 zm.oninput=()=>keep(()=>{zoom=+zm.value});
 let d=null;
 cv.onpointerdown=e=>{d=[e.clientX,e.clientY,ox,oy];cv.setPointerCapture(e.pointerId)};
 cv.onpointermove=e=>{if(!d)return;const k=W/cv.getBoundingClientRect().width;ox=d[2]+(e.clientX-d[0])*k;oy=d[3]+(e.clientY-d[1])*k;clamp();draw()};
 cv.onpointerup=cv.onpointercancel=()=>{d=null};
 return{el:wrap,setRatio(n){r=n;keep(dims)},
  async out(){const[a,b]=RAT[r];
   for(const L of [480,400,320,260,200,160,128]){
    const ow=a>=b?L:Math.round(L*a/b),oh=a>=b?Math.round(L*b/a):L,c=document.createElement('canvas');c.width=ow;c.height=oh;
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,ow,oh);x.drawImage(bmp,-ox/s,-oy/s,W/s,H/s,0,0,ow,oh);
    for(let q=.85;q>=.35;q-=.1){const bl=await toBlob(c,q);if(bl.size<=MAXB)return{blob:bl,b64:await toB64(bl)}}}
   throw new Error('size')}}}

const STAT=['Belum masuk','Sementara','Final'];
let S={calon:[],desa:[]},TAB='v',FLASH='';
const nf=n=>n==null||n===''?'':Number(n).toLocaleString('id-ID');
const act=(k,d)=>S.calon.filter(c=>c.kecamatan===k&&c.desa===d&&c.aktif).sort((a,b)=>(+a.nomor_urut||99)-(+b.nomor_urut||99));
const inf=(k,d)=>S.desa.find(x=>x.kecamatan===k&&x.desa===d)||{status:STAT[0],updated:0};
const opt=(t,v)=>{const o=el('option',null,t);o.value=v;return o};
async function run(fn,data,m){m.className='st';m.textContent='Menyimpan...';
 try{const r=await call(fn,data);
  if(r.error){m.textContent=r.error==='unauthorized'?'Sesi tidak valid atau terkunci. Muat ulang halaman.':r.error;return null}
  S={calon:r.calon,desa:r.desa};return r}
 catch(e){m.textContent='Gagal terhubung. Coba lagi.';return null}}
$('go').onclick=async()=>{KEY=$('key').value;$('msg').textContent='Memuat...';
 try{const r=await call('list');if(r.error){$('msg').textContent=r.error==='unauthorized'?'Kunci admin salah.':r.error;return}
  S={calon:r.calon,desa:r.desa};$('login').hidden=true;$('work').hidden=false;fillK()}catch(e){$('msg').textContent='Gagal terhubung.'}};
$('key').onkeydown=e=>{if(e.key==='Enter')$('go').click()};
function fillK(k,d){const ks=[...new Set(S.calon.map(c=>c.kecamatan))];
 $('fk').replaceChildren(...ks.map(x=>opt(x,x)));if(k&&ks.includes(k))$('fk').value=k;
 $('kl').replaceChildren(...ks.map(x=>opt('',x)));$('dl').replaceChildren(...[...new Set(S.calon.map(c=>c.desa))].map(x=>opt('',x)));fillD(d)}
function fillD(d){const k=$('fk').value,ds=S.desa.filter(x=>x.kecamatan===k);
 $('fd').replaceChildren(...ds.map(x=>opt(x.desa+'  ('+x.status+')',x.desa)));if(d&&ds.some(x=>x.desa===d))$('fd').value=d;show()}
$('fk').onchange=()=>fillD();$('fd').onchange=show;
document.querySelectorAll('[role=tab]').forEach(b=>b.onclick=()=>{TAB=b.dataset.t;
 document.querySelectorAll('[role=tab]').forEach(x=>x.setAttribute('aria-selected',String(x===b)));
 ['v','c','p'].forEach(t=>$('t'+t).hidden=t!==TAB);$('sel').hidden=TAB==='p';show()});
function show(){const c={};S.desa.forEach(x=>c[x.status]=(c[x.status]||0)+1);
 $('sum').textContent='Final '+(c.Final||0)+' · Sementara '+(c.Sementara||0)+' · Belum masuk '+(c['Belum masuk']||0)+' dari '+S.desa.length+' desa';
 if(TAB==='v')vote();if(TAB==='c')cards()}
function vote(){
 const k=$('fk').value,d=$('fd').value,cs=act(k,d),i=inf(k,d),box=$('vform');
 if(!cs.length){box.replaceChildren(el('p','st','Desa ini belum punya calon aktif. Tambahkan atau aktifkan di tab Calon dan foto.'));return}
 const ins=[],pcs=[],tot=el('b','','0'),m=el('p','st',FLASH);if(FLASH)m.className='st ok';FLASH='';
 const rowsEl=cs.map((c,n)=>{const r=el('div','vr'),lb=el('label','vl'),x=el('input'),p=el('span','pc');
  x.type='number';x.min='0';x.step='1';x.inputMode='numeric';x.value=c.suara==null?'':c.suara;x.dataset.id=c.id;
  x.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();(ins[n+1]||b1).focus()}};
  ins.push(x);pcs.push(p);lb.append(el('span','vn',c.nomor_urut||'-'),el('span','',proper(c.nama)+(c.petahana?' (petahana)':'')),x);r.append(lb,p);return r});
 const sl=el('label','','Status desa'),st=el('select');STAT.forEach(s=>st.append(opt(s,s)));st.value=i.status;sl.append(st);
 const calc=()=>{const t=ins.reduce((a,x)=>a+(+x.value||0),0);tot.textContent=nf(t);
  ins.forEach((x,n)=>pcs[n].textContent=x.value!==''&&t>0?(+x.value/t*100).toFixed(2)+'%':'');
  if(st.value===STAT[0]&&ins.some(x=>x.value!==''))st.value=STAT[1]};
 ins.forEach(x=>x.oninput=calc);
 const b1=el('button','btn','Simpan'),b2=el('button','btn alt','Simpan dan lanjut ke desa berikutnya');b1.type=b2.type='button';
 const save=async next=>{b1.disabled=b2.disabled=true;const suara={};ins.forEach(x=>suara[x.dataset.id]=x.value.trim());
  const r=await run('saveVotes',{kecamatan:k,desa:d,status:st.value,suara},m);b1.disabled=b2.disabled=false;if(!r)return;
  FLASH='Tersimpan.';
  if(next){const idx=S.desa.findIndex(x=>x.kecamatan===k&&x.desa===d),nx=S.desa.slice(idx+1).concat(S.desa.slice(0,idx)).find(x=>x.status===STAT[0]);
   if(nx){fillK(nx.kecamatan,nx.desa);return}FLASH='Tersimpan. Semua desa sudah masuk.'}
  fillK(k,d)};
 b1.onclick=()=>save(false);b2.onclick=()=>save(true);
 const tr=el('div','vr');tr.append(el('span','vl','Total suara'),tot);
 const bt=el('div','btns');bt.append(b1,b2);
 box.replaceChildren(el('p','nm',d+' · Kec. '+k),el('p','st','Terakhir diperbarui: '+(i.updated?new Date(i.updated).toLocaleString('id-ID',{timeZone:'Asia/Jakarta'})+' WIB':'belum ada')),
  ...rowsEl,tr,sl,bt,m);calc()}
function cards(){const k=$('fk').value,d=$('fd').value;
 $('list').replaceChildren(...S.calon.filter(c=>c.kecamatan===k&&c.desa===d).map(card))}
function card(it){
 const c=el('div','card cal'),ph=el('div','ph',it.nama.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase());
 ph.style.setProperty('--ar',AR[it.rasio]||'2/3');
 const show=u=>{ph.querySelector('img')?.remove();const im=new Image();im.src=u;im.alt='Foto '+it.nama;im.onerror=()=>im.remove();ph.append(im)};
 if(it.foto)show(it.foto);
 const b=el('div'),f=el('div','f'),st=el('p','st');st.setAttribute('role','status');
 const ml=el('label','nmf','Nama calon'),nm=el('input');nm.type='text';nm.maxLength=80;nm.value=proper(it.nama);ml.append(nm);
 const nl=el('label','nu','Nomor urut'),num=el('input');num.type='number';num.min='1';num.max='99';num.value=it.nomor_urut||'';nl.append(num);
 const rl=el('label','rs','Rasio foto'),rs=el('select');Object.keys(RAT).forEach(x=>rs.append(opt(RL[x],x)));rs.value=it.rasio||'4x6';rl.append(rs);
 const fl=el('label','','Foto baru (JPG/PNG)'),file=el('input');file.type='file';file.accept='image/*';fl.append(file);
 const pl=el('label','ck'),pe=el('input');pe.type='checkbox';pe.checked=it.petahana;pl.append(pe,' Petahana');
 const al=el('label','ck'),ae=el('input');ae.type='checkbox';ae.checked=it.aktif;al.append(ae,' Aktif (tampil di dashboard)');
 const btn=el('button','btn','Simpan');btn.type='button';
 let ed=null;
 file.onchange=async()=>{if(!file.files[0])return;st.className='st';
  try{if(ed)ed.el.remove();ed=await makeEditor(file.files[0],rs.value);b.insertBefore(ed.el,st);st.textContent=''}
  catch(e){ed=null;st.textContent='Gagal membaca foto. Gunakan JPG atau PNG.'}};
 rs.onchange=()=>{ph.style.setProperty('--ar',AR[rs.value]);if(ed)ed.setRatio(rs.value)};
 btn.onclick=async()=>{btn.disabled=true;
  const data={id:it.id,nama:proper(nm.value),petahana:pe.checked,aktif:ae.checked,nomor_urut:num.value.trim(),rasio:rs.value};let kb='';
  try{if(ed){const o=await ed.out();data.foto_b64=o.b64;kb=' Foto dikompres menjadi '+Math.max(1,Math.round(o.blob.size/1024))+' KB.';show(URL.createObjectURL(o.blob))}
   const r=await run('saveCalon',data,st);
   if(r){st.textContent='Tersimpan.'+kb;st.className='st ok';if(ed){ed.el.remove();ed=null;file.value=''}}
  }catch(e){st.textContent=e.message==='size'?'Foto tidak bisa dikecilkan sampai 40 KB. Coba foto lain.':'Gagal memproses foto. Gunakan JPG atau PNG.'}
  btn.disabled=false};
 f.append(ml,nl,rl,fl,pl,al,btn);b.append(f,st);c.append(ph,b);return c}
$('addb').onclick=async()=>{const k=$('ak').value.trim().toUpperCase(),d=$('ad').value.trim().toUpperCase(),m=$('addm');
 const r=await run('addCalon',{kecamatan:k,desa:d,nama:proper($('an').value),petahana:$('ap').checked},m);
 if(r){$('an').value='';$('ap').checked=false;fillK(k,d);m.textContent='Calon ditambahkan ke desa '+d+'.';m.className='st ok'}};
$('rb').onclick=async()=>{const m=$('rm'),r=await run('reset',{confirm:$('rc').value.trim()},m);
 if(r){$('rc').value='';m.textContent='Semua suara dikosongkan.';m.className='st ok';fillK($('fk').value,$('fd').value)}};
</script>
</body>
</html>
